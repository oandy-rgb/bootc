name: Build bootc image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "05 10 * * *"
  workflow_dispatch:

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  IMAGE_NAME: laptop

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Check recipe and shell syntax
        run: just check

      # Aurora 基底映像很大，runner 預設剩餘空間放不下，先刪掉用不到的工具鏈。
      - name: Maximize build space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force
          df -h /

      # just build 用 sudo podman，映像在 root 的儲存區，所以 tag/push 也要用 sudo。
      - name: Build local image
        run: just build

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GitHub Container Registry for root Podman
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push image
        if: github.event_name != 'pull_request'
        id: push
        run: |
          image="${IMAGE_REGISTRY}/${IMAGE_NAME}:latest"
          sudo podman tag "localhost/${IMAGE_NAME}:latest" "$image"
          sudo podman push --digestfile=/tmp/image-digest "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$(cat /tmp/image-digest)" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        if: github.event_name != 'pull_request' && env.SIGNING_SECRET != ''
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign published image
        if: github.event_name != 'pull_request' && env.SIGNING_SECRET != ''
        run: cosign sign -y --key env://SIGNING_SECRET "${{ steps.push.outputs.image }}@${{ steps.push.outputs.digest }}"
