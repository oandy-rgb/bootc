# Nix 的實際資料放在可寫且跨 bootc 更新保留的 /var/lib。
# 這個位置會套用 var_lib_t，避免 SELinux 擋下 nix-daemon socket。
d /var/lib/nix                             0755 root root   -
d /var/lib/nix/store                       1775 root nixbld -
d /var/lib/nix/var                         0755 root root   -
d /var/lib/nix/var/log                     0755 root root   -
d /var/lib/nix/var/log/nix                 0755 root root   -
d /var/lib/nix/var/log/nix/drvs            0775 root nixbld -
d /var/lib/nix/var/nix                     0775 root nixbld -
d /var/lib/nix/var/nix/builds              0755 root root   7d
d /var/lib/nix/var/nix/daemon-socket       0755 root root   -

# daemon 在 /run 建立 socket；Nix 預設路徑透過符號連結使用它。
d  /run/nix-daemon                                      0755 root root -
L+ /var/lib/nix/var/nix/daemon-socket/socket            -    -    -    - /run/nix-daemon/socket
