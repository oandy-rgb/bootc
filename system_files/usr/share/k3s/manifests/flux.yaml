# Flux Operator 與 FluxInstance，由 k3s 內建的 Helm controller 安裝。
# k3s.service 啟動前會把這個資料夾複製到 /var/lib/rancher/k3s/server/manifests/。
# 不要刪除或改名：HelmChart 消失時 k3s 會解除安裝對應的 release。
# 需要的 secret（flux-system、sops-age）不放進映像檔，見 `just flux-secrets`。
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: flux-operator
  namespace: kube-system
spec:
  chart: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator
  version: "0.61.0"
  targetNamespace: flux-system
  createNamespace: true
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: flux-instance
  namespace: kube-system
spec:
  chart: oci://ghcr.io/controlplaneio-fluxcd/charts/flux-instance
  version: "0.61.0"
  targetNamespace: flux-system
  createNamespace: true
  valuesContent: |-
    instance:
      distribution:
        version: "2.x"
        registry: ghcr.io/fluxcd
      components:
        - source-controller
        - kustomize-controller
        - helm-controller
        - notification-controller
      sync:
        kind: GitRepository
        url: https://github.com/oandy-rgb/home-ops.git
        ref: refs/heads/main
        path: clusters/oandy-laptop
        pullSecret: flux-system
        interval: 1m
